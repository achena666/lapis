#################################################################
#-------------------  service-uaa 配置  -------------------------#
#################################################################

spring:
  application:
    name: service-uaa
  cloud:
    config:
      discovery:
        service-id: service-config
        enabled: true
      fail-fast: true
      profile: dev
      name: common, eureka-client, redis, rabbitmq, ${spring.application.name}, oauth2-resource, actuator, swagger
  main:
    allow-bean-definition-overriding: true


# service-config 服务端配置

#配置eureka 的注册中心
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    # 【2026-10 修正】原值为 2 秒，是纯本地调试用的极限值，
    # 生产环境会给注册中心带来大量无效拉取请求，改回 Spring Cloud 默认语义的合理值。
    registry-fetch-interval-seconds: 10
  #租约期限以及续约期限的配置
  instance:
    prefer-ip-address: true
    # 【2026-10 修正】固定为回环地址，避免切换网络后注册地址失效（详见 eureka-client-dev.yml 注释）
    ip-address: 127.0.0.1
    hostname: localhost

    # 【2026-10 修正】原值 6 秒 / 3 秒同样是为本地"秒级感知上下线"调的，
    # 生产上网络抖动就会造成服务被误剔除。改为较稳妥的 30 秒 / 10 秒。
    # 租约到期，服务失效时间
    lease-expiration-duration-in-seconds: 30
    # 租约续约间隔时间
    lease-renewal-interval-in-seconds: 10

# 【2026-10 修正】删除 ribbon.ServerListRefreshInterval：
# Netflix Ribbon 自 Spring Cloud 2020.0 起已被移除（现由 Spring Cloud LoadBalancer 取代），
# 该配置项在当前 Spring Cloud 2025.1.x 上完全无效，属于历史残留。

#服务端口
server:
  port: 8769

spring:
  application:
    name: service-config #服务名称

  profiles:
    active: native #设置为本地启动的方式，而不是通过git
  cloud:
    config:
      server:
        native:
          #搜索位置(可用的通配符有3个，分别是: {application} 映射客户端spring.application.name, {profile} 映射客户端spring.profiles.active[多个以逗号分隔], {label}这是服务器端功能，标记了一组“版本化”的配置文件。 )
          search-locations: classpath:/{profile}

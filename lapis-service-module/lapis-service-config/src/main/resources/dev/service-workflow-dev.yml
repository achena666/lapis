#工作流 数据库 dev 环境配置

server:
  port: 8764

spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/workflow?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:111111}

eureka:
  instance:
    prefer-ip-address: true
    # 【2026-10 修正】固定为回环地址，避免切换网络后注册地址失效（详见 eureka-client-dev.yml 注释）
    ip-address: 127.0.0.1
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 8700

spring:
  cloud:
    gateway:
      server:
        webflux:
          # 只信任内网与本机代理；原配置里写死的公网 IP 属于个人信息泄露，已移除
          trusted-proxies: "192\\.168\\..*|10\\.\\d+\\.\\d+\\.\\d+|172\\.(1[6-9]|2\\d|3[01])\\..*|127\\.0\\.0\\.1"
          httpclient:
            ssl:
              # 生产环境必须为 false：true 表示信任所有下游证书，等于关闭 TLS 校验
              useInsecureTrustManager: ${GATEWAY_INSECURE_TRUST_MANAGER:false}
          discovery:
            locator:
              # 微服务名称转为小写（默认注册到 Eureka时会变大写），以方便下面 routes的配置
              lowerCaseServiceId: true
              enabled: true

          # 配置路由节点: uri -> 目标服务地址; predicates -> 断言; 【filters -> 过滤器: (StripPrefix -> 要去除的 url前缀层级 比如predicates的Path=/api/admin/**, 转发到 service-admin的请求为 /**)】;
          routes:

            # 认证服务
            - id: service-uaa
              uri: lb://service-uaa
              predicates:
                - Path=/api/uaa/**
              filters:
                - StripPrefix=2

            # 管理服务
            - id: service-admin
              uri: lb://service-admin
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=2

            # 事件日志服务
            - id: service-eventlog
              uri: lb://service-eventlog
              predicates:
                - Path=/api/eventlog/**
              filters:
                - StripPrefix=2

            # 工具箱服务
            - id: toolbox-server
              uri: lb://toolbox-server
              predicates:
                - Path=/api/toolbox/**
              filters:
                - StripPrefix=2

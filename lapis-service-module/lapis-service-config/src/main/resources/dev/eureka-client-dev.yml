#eureka 注册地址配置
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


    # EurekaClient每隔多久从EurekaServer拉取一次服务列表，默认30秒，这里修改为2秒钟从注册中心拉取一次
    registry-fetch-interval-seconds: 2
  #租约期限以及续约期限的配置
  instance:
    prefer-ip-address: true

    # 【2026-10 修正】固定注册地址为回环地址。
    # 原因：不指定时 Spring Cloud 会在启动时自动探测本机网卡 IP 并注册。
    # 一旦之后切换网络（换 Wi-Fi、断开/连接 VPN、公司网与家庭网切换），
    # 已启动的服务仍持有旧 IP，Gateway 通过 lb://service-xxx 解析就会
    # "Connection timed out"，表现为全站 500，排查成本很高。
    # 本地开发固定 127.0.0.1 可彻底免疫网络变化。
    # 注意：仅作用于 dev profile，生产配置不受影响。
    ip-address: 127.0.0.1
    hostname: localhost

    #租约到期，服务失效时间，默认值90秒，服务超过90秒没有发生心跳，EurekaServer会将服务从列表移除
    #这里修改为10秒
    lease-expiration-duration-in-seconds: 10
    #租约续约间隔时间，默认30秒，这里修改为5秒钟
    lease-renewal-interval-in-seconds: 5

#这里是Ribbon缓存实例列表的刷新间隔，默认30秒钟，这里修改为每秒钟刷新一次实例信息
ribbon:
  ServerListRefreshInterval: 5000
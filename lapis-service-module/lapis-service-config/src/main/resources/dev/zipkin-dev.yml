# 分布式链路追踪配置
#
# 【2026-10 修正】原配置使用的 spring.zipkin.* 与 spring.sleuth.* 是
# Spring Boot 2.x / Spring Cloud Hoxton 时代的写法：
#   - Spring Cloud Sleuth 已在 Spring Cloud 2022.0 起停止维护；
#   - spring.zipkin.* / spring.sleuth.* 属性在 Spring Boot 3 起已被移除；
# 当前项目基于 Spring Boot 4.0.6 + Spring Cloud 2025.1.x，
# 应改用 Micrometer Tracing（本项目使用 Brave 桥接 + Zipkin 上报）。
#
# 依赖已在 lapis-service-dependency 中补齐：
#   io.micrometer:micrometer-tracing-bridge-brave
#   io.zipkin.reporter2:zipkin-reporter-brave

management:
  tracing:
    sampling:
      # 采样率：1.0 表示全量采样，仅建议本地/测试环境使用
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    org.springframework.cloud.openfeign: debug

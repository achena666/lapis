# auth-server-dev 配置

server:
  port: 8762

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lapis_uaa_dev?useSSL=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

    hikari:
      maximum-pool-size: 10                   # 最大连接池大小 (默认值: 10)
      minimum-idle: 5                         # 空闲连接的最小数量 (连接池中的最小连接数)
      idle-timeout: 600000                    # 空闲连接存活的最大时间，单位是毫秒 (超时未使用的连接将被关闭，默认值: 600000, 即10分钟)
      max-lifetime: 1800000                   # 连接池中连接的最长生命周期，单位是毫秒 (默认值: 1800000, 即30分钟)
      connection-timeout: 30000               # 获取连接的最大等待时间，单位是毫秒 (超过时间将抛出异常, 默认值: 30000, 即30秒)
      initialization-fail-timeout: 1          # 是否在获取连接时检测连接是否有效，默认为 true
      auto-commit: true                       # 连接是否自动提交
      leak-detection-threshold: 2000          # 慢 SQL 阈值 (仅日志警告), 单位是毫秒

      # 连接池启动时初始化的连接数 (可选，默认会根据 minimum-idle 动态调整)
      # initial-size: 5

# 登录查询签名密钥
login:
  lookup:
    secret: ${LOGIN_LOOKUP_SECRET:b1bb9d50-cb3b-4ddd-881e-7f71049a3acf}


# ==================== 安全配置（2026-10 加固）====================
# 令牌 Cookie 的安全属性：CookieTokenResponseHandler 会读取这些值
lapis:
  security:
    cookie:
      # SameSite=Lax 可阻断跨站请求携带令牌，是本项目 CSRF 的主要缓解手段
      same-site: ${COOKIE_SAME_SITE:Lax}
      # 仅通过 HTTPS 传输；本地 HTTP 开发为 false，部署 HTTPS 时必须为 true
      secure: ${COOKIE_SECURE:false}
    csrf:
      # 默认关闭（登录端点需先放行），生产建议开启，开启后前端需带 X-XSRF-TOKEN 头
      enabled: ${CSRF_ENABLED:false}
      ignore-paths: /oauth2/**,/captchas/**
    permit-paths:

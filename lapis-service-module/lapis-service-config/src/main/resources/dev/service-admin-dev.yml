#service-admin配置

server:
  port: 8763

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lapis_admin_dev?useSSL=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

    hikari:
      maximum-pool-size: 10                   # 最大连接池大小 (默认值: 10)
      minimum-idle: 5                         # 空闲连接的最小数量 (连接池中的最小连接数)
      idle-timeout: 600000                    # 空闲连接存活的最大时间，单位是毫秒 (超时未使用的连接将被关闭，默认值: 600000, 即10分钟)
      max-lifetime: 1800000                   # 连接池中连接的最长生命周期，单位是毫秒 (默认值: 1800000, 即30分钟)
      connection-timeout: 30000               # 获取连接的最大等待时间，单位是毫秒 (超过时间将抛出异常, 默认值: 30000, 即30秒)
      initialization-fail-timeout: 1          # 是否在获取连接时检测连接是否有效，默认为 true
      auto-commit: true                       # 连接是否自动提交
      leak-detection-threshold: 2000          # 慢 SQL 阈值 (仅日志警告), 单位是毫秒

      # 连接池启动时初始化的连接数 (可选，默认会根据 minimum-idle 动态调整)
      # initial-size: 5

# 登录查询签名密钥
login:
  lookup:
    secret: ${LOGIN_LOOKUP_SECRET:b1bb9d50-cb3b-4ddd-881e-7f71049a3acf}

# P6Spy 配置
decorator:
  datasource:
    p6spy:
      logging: SLF4J
      log-format: executionTime:%(executionTime) | sql:%(sqlSingleLine)


# ==================== 安全配置（2026-10 加固）====================
# 说明：原先 service-admin 用 WebSecurity.ignoring() 放行了一批业务路径，
#       ignoring() 会完全绕过 Spring Security 过滤器链，且网关把 /api/admin/** 直接转发，
#       等于对公网匿名开放。现在统一改为 permitAll()（仍经过完整过滤器链），
#       并删除了 5 条代码中根本不存在的"幽灵白名单"（/userInfo/**、/EnumController/** 等）。
lapis:
  security:
    # 无需认证即可访问的路径（任意方法）：UAA 通过 Feign 调用的用户查询
    permit-paths: /sys/users/login-lookup
    # 仅允许 POST 匿名访问的路径：UAA 上报登录历史（避免 GET 列表接口被绕过鉴权）
    permit-post-paths: /sys/login-histories
    csrf:
      # 令牌 Cookie 已强制 SameSite=Lax 作为 CSRF 缓解；生产环境建议改为 true
      enabled: false
      ignore-paths: /oauth2/**,/captchas/**
    cookie:
      same-site: Lax
      # 部署到 HTTPS 环境时必须改为 true
      secure: false
